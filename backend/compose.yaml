services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${TEN_CO_SO_DU_LIEU:-quan_ly_dang_vien}
      POSTGRES_USER: ${TAI_KHOAN_CO_SO_DU_LIEU:-ptit_dev}
      POSTGRES_PASSWORD: ${MAT_KHAU_CO_SO_DU_LIEU:?Khai bao MAT_KHAU_CO_SO_DU_LIEU trong backend/.env}
    ports:
      - "127.0.0.1:${CONG_CO_SO_DU_LIEU:-55432}:5432"
    volumes:
      - du_lieu_co_so_du_lieu:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  du_lieu_co_so_du_lieu:
